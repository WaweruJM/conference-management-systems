# ─────────────────────────────────────────────────────────────────────────────
# SCMS — Docker image release to GitHub Container Registry (GHCR)
#
# Triggers:
#   • Manual dispatch     — publish any tag on demand (workflow_dispatch)
#   • Push a git tag `v*` — auto-release (e.g. `git tag v2.0.0 && git push --tags`)
#
# Publishes:
#   ghcr.io/<owner>/<repo>:<tag>     (e.g. v2.0.0)
#   ghcr.io/<owner>/<repo>:latest    (only for the highest semver tag pushed)
#
# Backward-compatibility with v1:
#   Before publishing v2 for the first time, tag the current live image as v1.
#   Run the workflow manually with `image_tag=v1.0.0` and `mark_latest=false`.
# ─────────────────────────────────────────────────────────────────────────────
name: Release container image to GHCR

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to publish (e.g. v2.0.0 or v1.0.0-backup)'
        required: true
        default: 'v2.0.0'
      mark_latest:
        description: 'Also tag as :latest ?'
        required: true
        default: 'true'
        type: choice
        options: [ 'true', 'false' ]

permissions:
  contents: read
  packages: write        # required to push to ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Resolve the tag from either the git ref (tag push) or the manual input
      - name: Derive image tags
        id: tags
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.image_tag }}"
            LATEST="${{ inputs.mark_latest }}"
          else
            TAG="${GITHUB_REF_NAME}"
            LATEST="true"
          fi
          LOWER_REPO="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${LOWER_REPO}"

          TAGS="${IMAGE}:${TAG}"
          if [[ "${LATEST}" == "true" ]]; then
            TAGS="${TAGS},${IMAGE}:latest"
          fi
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}"     >> "$GITHUB_OUTPUT"
          echo "tags=${TAGS}"   >> "$GITHUB_OUTPUT"
          echo "→ will publish: ${TAGS}"

      # Enable BuildKit + docker layer cache for fast rebuilds
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          # The frontend bundle bakes NEXT_PUBLIC_BASE_URL at build time.
          # Set a GitHub Actions variable named PROD_BASE_URL if you want the
          # baked URL to differ from https://medals-scms.mod.go.ke.
          build-args: |
            NEXT_PUBLIC_BASE_URL=${{ vars.PROD_BASE_URL || 'https://medals-scms.mod.go.ke' }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max
          # Multi-platform builds increase runtime; enable only if you deploy to ARM.
          # platforms: linux/amd64,linux/arm64

      - name: Summary
        run: |
          echo "## Released \`${{ steps.tags.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Pushed tags:" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.tags.outputs.tags }}" | tr ',' '\n' >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Pull with:" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`bash" >> "$GITHUB_STEP_SUMMARY"
          echo "docker pull ${{ steps.tags.outputs.image }}:${{ steps.tags.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
